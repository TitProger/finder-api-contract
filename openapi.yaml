openapi: 3.1.0
info:
  title: Finder API
  version: 0.16.0
  description: >
    Контракт API Finder.
    Источник правды — этот репозиторий (git tag).
servers:
  - url: http://localhost:8090
    description: local
tags:
  - name: health
    description: Проверка работоспособности
  - name: categories
    description: Справочник категорий для админа
  - name: taxonomy
    description: Дерево категорий Wikkeo — поиск пути и админская правка
  - name: inquiries
    description: Заявка клиента и назначение категории админом
  - name: client-inquiries
    description: Клиентская заявка сайта без Telegram-полей
  - name: optimal-cards
    description: Оптимальная карточка (наследие). Новые сценарии — тег dossiers
  - name: dossiers
    description: Утверждённое каноническое досье и live-кэш
  - name: research
    description: Очередь ресерча на Postgres, ingest и сырые свидетельства
  - name: rates
    description: Книга ставок владельца и детерминированные калькуляторы логистики и маржи
  - name: products
    description: История поиска и безопасный отчёт карточки для клиента
  - name: search
    description: Пачка вопросов первой страницы
  - name: files
    description: Файлы хранилища и карточки
