upload:
  post:
    operationId: uploadStoredFile
    security: []
    tags: [files]
    summary: Загрузить фото для заявки
    description: >
      Публичная загрузка в файловое хранилище. Multipart-поле file.
      Только jpg, jpeg, png, webp. В ответе id файла для mediaIds заявки.
      Это не Telegram file_id.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../../components/schemas/file/stored-file.yaml#/UploadStoredFileRequest'
    responses:
      '200':
        description: Файл сохранён
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/file/stored-file.yaml#/StoredFile'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

content:
  get:
    operationId: getStoredFileContent
    security: []
    tags: [files]
    summary: Байты файла карточки
    description: Обложка и галерея. Повтор того же пути в сиде не создаёт второй файл.
    parameters:
      - $ref: '../../components/parameters/common.yaml#/IdPath'
    responses:
      '200':
        description: Содержимое файла
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
