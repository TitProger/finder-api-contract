content:
  get:
    operationId: getStoredFileContent
    security: []
    tags: [files]
    summary: Байты файла карточки
    description: Обложка и галерея. Повтор того же пути в сиде не создаёт второй файл.
    parameters:
      - $ref: '../../components/parameters/common.yaml#/IdPath'
    responses:
      '200':
        description: Содержимое файла
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
