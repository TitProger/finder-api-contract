create:
  post:
    operationId: createInquiry
    tags: [inquiries]
    summary: Создать заявку текстом
    description: >
      Только админ (статический ADMIN_API_TOKEN). Клиент определяется telegram user id — это вход, не регистрация.
      Точная фраза активной категории пишет category_id и отдаёт вопросы этой категории
      и одного пакета, если текст точно совпал с его code или title.
      Иначе заявка на паузе, category_id пустой, research_run не создаётся.
      Telegram-бот и парсеры не вызываются.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/inquiry/inquiry.yaml#/CreateInquiryRequest'
    responses:
      '200':
        description: Заявка после классификации
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/Inquiry'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses/errors.yaml#/Forbidden'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

byId:
  get:
    operationId: getInquiryById
    tags: [inquiries]
    summary: Прочитать заявку
    description: >
      Только админ (статический ADMIN_API_TOKEN). Идентификатор заявки — uuid.
      На паузе questions пустой. После категории — вопросы базы и выбранного пакета.
      Если обязательные ответы совпали с живой карточкой, статус SERVED_FROM_DATABASE
      и в ответе сама карточка. Иначе карточка пустая. research_run не создаётся.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Заявка
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/Inquiry'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

assignCategory:
  post:
    operationId: assignInquiryCategory
    tags: [inquiries]
    summary: Назначить категорию
    description: >
      Только ADMIN. Снимает паузу, пишет category_id и дописывает фразу клиента в category_phrase.
      Повтор той же фразы в категории ошибкой не считается.
      research_run не создаётся.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/inquiry/inquiry.yaml#/AssignCategoryRequest'
    responses:
      '200':
        description: Заявка после назначения
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/Inquiry'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '409':
        $ref: '../../components/responses/errors.yaml#/Conflict'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

assignNewCategory:
  post:
    operationId: createCategoryAndAssignInquiry
    tags: [inquiries]
    summary: Создать категорию и назначить
    description: >
      Только ADMIN. Создаёт активную категорию, назначает её заявке и дописывает фразу клиента.
      Пауза снимается. research_run не создаётся.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/inquiry/inquiry.yaml#/CreateCategoryAndAssignRequest'
    responses:
      '200':
        description: Заявка после новой категории
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/Inquiry'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '409':
        $ref: '../../components/responses/errors.yaml#/Conflict'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

rerunResearch:
  post:
    operationId: rerunInquiryResearch
    tags: [inquiries]
    summary: Повторно запустить ресерч
    description: >
      Только админ (статический ADMIN_API_TOKEN).
      Создаёт новый run_id и снова шлёт webhook. Дневной лимит клиента не списывается.
      Заявка должна быть в RESEARCHING или DOSSIER_WITH_ADMIN и с категорией.
      В ответе нет цен.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Новый прогон поставлен в очередь
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/ResearchRerunResult'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '409':
        $ref: '../../components/responses/errors.yaml#/Conflict'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

economics:
  get:
    operationId: getInquiryEconomics
    tags: [inquiries]
    summary: Слои цен и ручная экономика заявки
    description: >
      Только админ (статический ADMIN_API_TOKEN).
      Слои FACTORY, CHINA_OPEN, RUSSIA_RETAIL и RUSSIA_WHOLESALE в рублях, без логистики.
      Разные единицы не смешиваются. Если в досье нет курса, берётся запасной и это помечается.
      Клиенту этот ответ не отправляется.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Слои и, если менеджер уже ввёл затраты, себестоимость
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/InquiryEconomics'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
  post:
    operationId: saveInquiryEconomics
    tags: [inquiries]
    summary: Записать ручные затраты и посчитать себестоимость
    description: >
      Только админ. Доставка за единицу, пошлина в процентах, прочие затраты и наценка в процентах.
      Себестоимость считается от минимальной заводской цены в рублях и сравнивается с розницей РФ той же единицы.
      client_price не заполняется: клиенту цена не уходит.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/inquiry/inquiry.yaml#/SaveInquiryEconomicsRequest'
    responses:
      '200':
        description: Затраты записаны, себестоимость посчитана
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/inquiry/inquiry.yaml#/InquiryEconomics'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
