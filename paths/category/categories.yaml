listCreate:
  post:
    operationId: createCategory
    security:
      - bearerAuth: []
    tags: [categories]
    summary: Создать категорию
    description: Только ADMIN. Без фраз, вопросов и площадок — их добавляют отдельными ручками.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/category/category.yaml#/CreateCategoryRequest'
    responses:
      '200':
        description: Созданная категория
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/category/category.yaml#/Category'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '409':
        $ref: '../../components/responses/errors.yaml#/Conflict'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

byId:
  get:
    operationId: getCategoryById
    security:
      - bearerAuth: []
    tags: [categories]
    summary: Категория с фразами, пакетами, вопросами и площадками
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Категория целиком
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/category/category.yaml#/CategoryDetail'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
  patch:
    operationId: updateCategory
    security:
      - bearerAuth: []
    tags: [categories]
    summary: Править категорию
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/category/category.yaml#/UpdateCategoryRequest'
    responses:
      '200':
        description: Обновлённая категория
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/category/category.yaml#/Category'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '404':
        $ref: '../../components/responses/errors.yaml#/NotFound'
      '409':
        $ref: '../../components/responses/errors.yaml#/Conflict'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

